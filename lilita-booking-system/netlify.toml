[build]
  command = "cd lilita-booking-system/frontend && npm run build"
  publish = "lilita-booking-system/frontend/dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
