<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Sheets Connector</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      padding: 40px;
      margin-bottom: 20px;
    }
    h1 { color: #333; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
    .subtitle { color: #666; margin-bottom: 30px; font-size: 14px; }
    .status {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #333;
    }
    .status.error { background: #fef0f0; border-left-color: #dc3545; color: #dc3545; }
    .status.success { background: #f0fdf4; border-left-color: #10b981; color: #10b981; }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:hover { background: #5568d3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
    button:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .button-secondary {
      background: #f0f4ff;
      color: #667eea;
      border: 1px solid #667eea;
    }
    .button-secondary:hover { background: #e8ecff; }
    .item {
      display: flex;
      align-items: center;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      margin-bottom: 8px;
      transition: all 0.3s;
    }
    .item:hover { background: #f9f9f9; border-color: #667eea; }
    .item input { width: 20px; height: 20px; cursor: pointer; margin-right: 12px; }
    .item-info { flex: 1; }
    .item-name { font-weight: 600; color: #333; margin-bottom: 4px; }
    .item-meta { font-size: 12px; color: #999; }
    .section { margin-top: 20px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🔗 Google Sheets Connector</h1>
      <p class="subtitle">Select a spreadsheet, then choose sheets to import</p>

      <div id="authStatus" class="status hidden"></div>

      <!-- Step 1: Auth -->
      <div id="authStep">
        <h2 style="font-size: 16px; margin-bottom: 12px;">Step 1: Authenticate</h2>
        <button id="authBtn" onclick="authenticate()">🔐 Connect Google Account</button>
      </div>

      <!-- Step 2-4: Main Flow -->
      <div id="mainFlow" class="hidden">
        <!-- Step 2: Select Spreadsheet -->
        <div id="spreadsheetStep" class="section">
          <h2 style="font-size: 16px; margin-bottom: 12px;">Step 1: Select Spreadsheet</h2>
          <p style="color: #666; margin-bottom: 16px; font-size: 14px;">Choose a Google Sheets file</p>
          <div id="spreadsheetsList"></div>
          <div style="margin-top: 16px;">
            <button onclick="loadSpreadsheets()">🔄 Refresh</button>
          </div>
        </div>

        <!-- Step 3: Select Sheets -->
        <div id="sheetsStep" class="section hidden">
          <h2 style="font-size: 16px; margin-bottom: 12px;">Step 2: Select Sheets</h2>
          <p style="color: #666; margin-bottom: 16px; font-size: 14px;">
            <span id="selectedSpreadsheetName"></span> - Choose sheets to import
          </p>
          <div id="sheetsList"></div>
          <div style="margin-top: 16px;">
            <button class="button-secondary" onclick="backToSpreadsheets()">← Back</button>
            <button onclick="startImport()" style="margin-left: 8px;">Import Now</button>
          </div>
        </div>
      </div>

      <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
        <button class="button-secondary" id="logoutBtn" onclick="logout()" style="display: none;">🔓 Disconnect</button>
      </div>
    </div>
  </div>

  <script>
    let selectedSpreadsheet = null;
    let selectedSpreadsheetId = null;
    let selectedSheets = [];

    async function authenticate() {
      try {
        const response = await fetch('/api/sheets/auth');
        const data = await response.json();
        if (data.authUrl) {
          window.location.href = data.authUrl;
        }
      } catch (err) {
        showStatus('Auth error: ' + err.message, 'error');
      }
    }

    async function loadSpreadsheets() {
      try {
        const response = await fetch('/api/sheets/list');
        const spreadsheets = await response.json();

        if (!spreadsheets.length) {
          showStatus('No spreadsheets found', 'error');
          return;
        }

        const list = document.getElementById('spreadsheetsList');
        list.innerHTML = '';

        spreadsheets.forEach((ss, i) => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <input type="radio" name="spreadsheet" id="ss_${i}" data-ss-id="${ss.id}" data-ss-name="${ss.name}" onchange="selectSpreadsheet(${i})">
            <div class="item-info">
              <div class="item-name">${ss.name}</div>
            </div>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        showStatus('Error loading spreadsheets: ' + err.message, 'error');
      }
    }

    async function selectSpreadsheet(idx) {
      const radio = document.querySelector(`#ss_${idx}`);
      selectedSpreadsheetId = radio.getAttribute('data-ss-id');
      selectedSpreadsheet = radio.getAttribute('data-ss-name');
      selectedSheets = [];

      document.getElementById('selectedSpreadsheetName').textContent = selectedSpreadsheet;
      document.getElementById('spreadsheetStep').classList.add('hidden');
      document.getElementById('sheetsStep').classList.remove('hidden');

      await loadSheets();
    }

    async function loadSheets() {
      try {
        const response = await fetch(`/api/sheets/tabs/${selectedSpreadsheetId}`);
        const sheets = await response.json();

        if (!sheets.length) {
          showStatus('No sheets found', 'error');
          return;
        }

        const list = document.getElementById('sheetsList');
        list.innerHTML = '';

        sheets.forEach((sheet, i) => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <input type="checkbox" id="sheet_${i}" data-sheet-name="${sheet.title}" onchange="updateSelectedSheets()">
            <div class="item-info">
              <div class="item-name">${sheet.title}</div>
            </div>
          `;
          list.appendChild(div);
        });
      } catch (err) {
        showStatus('Error loading sheets: ' + err.message, 'error');
      }
    }

    function updateSelectedSheets() {
      selectedSheets = [];
      document.querySelectorAll('input[id^="sheet_"]:checked').forEach(cb => {
        selectedSheets.push({
          name: cb.getAttribute('data-sheet-name')
        });
      });
    }

    function backToSpreadsheets() {
      document.getElementById('spreadsheetStep').classList.remove('hidden');
      document.getElementById('sheetsStep').classList.add('hidden');
    }

    async function startImport() {
      if (selectedSheets.length === 0) {
        showStatus('Select at least one sheet', 'error');
        return;
      }

      try {
        const response = await fetch('/api/sheets/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            spreadsheetIds: selectedSheets.map(() => selectedSpreadsheetId),
            sheetNames: selectedSheets.map(s => s.name)
          })
        });

        const result = await response.json();

        if (result.success) {
          showStatus(`✓ Import successful! Imported: ${result.imported}, Skipped: ${result.skipped}`, 'success');
        } else {
          showStatus('Import failed: ' + result.error, 'error');
        }
      } catch (err) {
        showStatus('Import error: ' + err.message, 'error');
      }
    }

    function showStatus(message, type = 'info') {
      const div = document.getElementById('authStatus');
      div.textContent = message;
      div.className = 'status ' + (type === 'error' ? 'error' : type === 'success' ? 'success' : '');
      div.classList.remove('hidden');
    }

    function logout() {
      fetch('/api/sheets/logout', { method: 'POST' });
      document.getElementById('authStep').classList.remove('hidden');
      document.getElementById('mainFlow').classList.add('hidden');
      document.getElementById('logoutBtn').style.display = 'none';
    }

    async function init() {
      try {
        const response = await fetch('/api/sheets/status');
        const data = await response.json();

        if (data.authenticated) {
          document.getElementById('authStep').classList.add('hidden');
          document.getElementById('mainFlow').classList.remove('hidden');
          document.getElementById('logoutBtn').style.display = 'inline-block';
          loadSpreadsheets();
        }
      } catch (err) {
        console.error('Init error:', err);
      }
    }

    init();
  </script>
</body>
</html>
